name: 배틀 시뮬레이터 APK

on:
  push:
    paths:
      - 'battle-kr/**'
      - 'sim/**'
      - 'data/**'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: 빌드
        run: |
          npm ci --omit=optional
          node build
          node battle-kr/scripts/gen-data.cjs
          node battle-kr/build.mjs --android
          cd battle-kr/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BattleSimKR-apk
          path: battle-kr/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BattleSimKR-web
          path: battle-kr/dist/
